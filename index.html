<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing:  border-box;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    body{
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      height: 100vh;
      background:linear-gradient(125deg,red,green);
    }
    h2{
      background-color: black;
      padding: 8px;
      margin-bottom: 30px;
      color: white;
      border: 1px solid  white;
      position: absolute;
      top: 20px;
      
      text-align: center;

    }
    .container{
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quote{
      position: relative;
      border-radius: 10px;
      background-color: white;
      width: 500px;    
      color: rgb(5, 5, 5);
      padding: 15px;
      box-shadow: 5px 10px 5px rgba(2, 4, 4, 0.6);
      
    }
    .new-quote{
     text-align: center;
     border-radius: 10px;
     border: none;
     background-color: rgb(66, 77, 77);
     padding: 8px;
     cursor: pointer;
     color: white;
    display: block;
    margin-top: 15px;
    margin-left: auto;
    

    }
    .new-quote:hover{
      background-color: cornflowerblue;
    }
  </style>
</head>
<body>
  <h2>Javascript Quote Generator</h2>
  <div class="container">
 
       <div class="quote">
<p> </p>




<button class="new-quote">New quote</button>
</div>
</div>
<script>

const btn=document.querySelector(".new-quote");

function generate(){
const random= Math.floor(Math.random()*quotesArray.length);

quotes.textContent=`"${quotesArray[random].text}" - ${quotesArray[random].author}`;
  }

btn.addEventListener('click', generate);
   generate();
</script>
</body>
</html>
